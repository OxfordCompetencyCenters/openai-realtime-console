[project]
name = "openai-realtime-console"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45.0.5",
    "numpy>=2.2.4",
    "openai>=1.65.2",
    "pyjwt>=2.10.1",
    "pypandoc>=1.15",
    "python-dotenv>=1.0.1",
]
license = "MIT"
license-files = ["LICENSE.md"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupytext>=1.16.7",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.7",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF"  # ruff
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
# Ignore:
#  * Line too long
"*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
